# ros_gz_bridge configuration for the dynamic obstacles
- ros_topic_name: "/model/dyn_obstacle_1/cmd_vel"
  gz_topic_name: "/model/dyn_obstacle_1/cmd_vel"
  ros_type_name: "geometry_msgs/msg/Twist"
  gz_type_name: "gz.msgs.Twist"
  direction: ROS_TO_GZ

- ros_topic_name: "/model/dyn_obstacle_1/odometry"
  gz_topic_name: "/model/dyn_obstacle_1/odometry"
  ros_type_name: "nav_msgs/msg/Odometry"
  gz_type_name: "gz.msgs.Odometry"
  direction: GZ_TO_ROS

- ros_topic_name: "/model/dyn_obstacle_2/cmd_vel"
  gz_topic_name: "/model/dyn_obstacle_2/cmd_vel"
  ros_type_name: "geometry_msgs/msg/Twist"
  gz_type_name: "gz.msgs.Twist"
  direction: ROS_TO_GZ

- ros_topic_name: "/model/dyn_obstacle_2/odometry"
  gz_topic_name: "/model/dyn_obstacle_2/odometry"
  ros_type_name: "nav_msgs/msg/Odometry"
  gz_type_name: "gz.msgs.Odometry"
  direction: GZ_TO_ROS
